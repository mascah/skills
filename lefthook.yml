pre-commit:
  parallel: true
  commands:
    tests:
      run: python3 -m unittest discover -s tests -v
    structure:
      run: python3 scripts/validate.py
    hermes:
      run: python3 __init__.py

commit-msg:
  commands:
    conventional:
      run: >-
        head -1 {1} | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+|Merge |Revert )'
        || { echo 'commit message must be conventional, e.g. "feat(skills): add research"'; exit 1; }
