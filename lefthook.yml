pre-commit:
  parallel: true
  commands:
    tests:
      run: uv run --project cli --extra dev pytest -q cli/tests
    lint:
      run: uv run --project cli grove lint
    hermes:
      run: python3 __init__.py

commit-msg:
  commands:
    conventional:
      run: >-
        head -1 {1} | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+|Merge |Revert )'
        || { echo 'commit message must be conventional, e.g. "feat(cli): add flag"'; exit 1; }
