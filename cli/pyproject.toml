[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grove"
version = "0.2.0"
description = "Repo-local project knowledge for coding agents: status, scoped context, lint, close."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grove = "grove.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["grove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
